[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookformatter"
version = "0.1.0"
description = "Format text, Markdown, web pages, and blogs into traditional book formats (EPUB + print-ready PDF)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Carol Anne Jiang" }]
keywords = ["epub", "pdf", "book", "typesetting", "blog", "markdown"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
    "Topic :: Printing",
]
# Core is dependency-free by design; PDF rendering uses WeasyPrint if
# installed, otherwise falls back to a local Chrome/Chromium binary.
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint>=60"]

[project.scripts]
bookformatter = "bookformatter.cli:main"
bookformatter-web = "bookformatter.web:main"

[tool.setuptools.packages.find]
include = ["bookformatter*"]
